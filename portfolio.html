<script>
(function(){
  'use strict';
  var gallery=document.getElementById('grid-gallery');
  var close=document.getElementById('project-close-fixed');
  var original=gallery&&gallery.querySelector('.slideshow nav .nav-close');
  if(!gallery||!original||!close)return;
  function sync(){
    var active=gallery.classList.contains('slideshow-open');
    document.body.classList.toggle('project-viewer-open',active);
    close.hidden=!active;
    var resume=document.querySelector('.resume-launch');
    if(resume)resume.hidden=active;
  }
  close.addEventListener('click',function(){original.click();sync();});
  new MutationObserver(sync).observe(gallery,{attributes:true,attributeFilter:['class']});
  document.body.classList.add('project-close-ready');
  sync();
})();
</script>
